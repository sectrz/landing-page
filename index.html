  <script>
    var player, isPlaying = false;
    var btn = document.getElementById('musicBtn');
    function onYouTubeIframeAPIReady(){
      player = new YT.Player('ytPlayer', {
        height: '1', width: '1',
        playerVars: { listType: 'playlist', list: 'PL6clOlNkMviImxelpxMaI4vqLh2sQqv-s', autoplay: 0, controls: 0, loop: 1, playsinline: 1 },
        events: {
          onReady: function(e){ e.target.setLoop(true); },
          onStateChange: function(e){
            if(e.data == 0){ player.playVideo(); }
          }
        }
      });
    }
    function toggleMusic(){
      if(!player) return;
      if(!isPlaying){
        player.unMute();
        player.playVideo();
        isPlaying = true;
        btn.textContent = '⏸️ Pause Musik';
        btn.classList.add('playing');
      } else {
        player.pauseVideo();
        isPlaying = false;
        btn.textContent = '🎵 Play Musik';
        btn.classList.remove('playing');
      }
    }
    btn.addEventListener('click', toggleMusic);
    document.addEventListener('click', function firstClick(){
      if(player && !isPlaying){
        player.unMute();
        player.playVideo();
        isPlaying = true;
        btn.textContent = '⏸️ Pause Musik';
        btn.classList.add('playing');
      }
    }, {once:true});
  </script>
